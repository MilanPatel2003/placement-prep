<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task manager</title>
    <style>
        .completed{
            text-decoration: line-through crimson;

        }
    </style>
</head>
<body>
    <input type="text" placeholder="enter task" id="taskInput">
    <button type="button" id="btn" onclick="addTask()">ADD TASK</button>
    <br />
    <ul id="ul_list">

    </ul>
</body>
<script>
 function addTask() {
     const inputText = document.getElementById("taskInput")
     const ul_list = document.getElementById("ul_list")
     const deleteButton = document.createElement('button')
     const newli = document.createElement("li")

     deleteButton.innerHTML = 'delete'
     
     newli.innerHTML = inputText.value
     newli.appendChild(deleteButton)

     deleteButton.onclick = function () {
        newli.remove()
     }
     

     ul_list.appendChild(newli)
     inputText.value = ""

     newli.onclick = function (params) {
        newli.classList.toggle("completed")
     }
     
     
 }
</script>
</html>
